# DRAFT. Publishes dist/ (the viewer plus whatever is listed in dist/data/manifest.json) to GitHub Pages.
# Not active until the draft branch is merged. The audit step refuses to deploy a CSV the manifest does not list
# or whose SHA-256 differs from the manifest.
name: Publish viewer
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Audit bundled data against the manifest
        run: python3 tools/audit_data.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
